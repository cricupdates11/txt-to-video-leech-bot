services:
  - type: worker
    name: txt-to-video-leech-bot
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    autoDeploy: true
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: MAX_URLS
        value: "10"
      - key: MAX_VIDEO_MB
        value: "49"
      - key: MAX_DOWNLOAD_MB
        value: "500"
      - key: MAX_CONCURRENT_JOBS
        value: "2"
      - key: PRIVATE_MODE
        value: "false"

